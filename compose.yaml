services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_relay}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent_relay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: agent-relay:local
    build:
      context: .
    container_name: agent-relay
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/agent_relay}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/agent_relay}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
