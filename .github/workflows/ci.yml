name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_DB: agent_relay
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  RELAY_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/agent_relay
  DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/agent_relay

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run existing tests
        run: pytest -q

  integration-tests:
    name: PostgreSQL integration tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start PostgreSQL from the project compose file
        run: |
          docker compose up -d postgres
          docker compose ps

      - name: Wait for PostgreSQL readiness
        run: |
          until docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run integration tests against PostgreSQL
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/agent_relay
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/agent_relay
        run: pytest -q

  docker-build:
    name: Build Docker image with unique tag
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute unique image tag
        id: tag
        run: |
          echo "value=${GITHUB_RUN_NUMBER:-0}-${GITHUB_SHA:-$(git rev-parse --short HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Build Agent Relay image
        run: |
          docker build -t "agent-relay:${{ steps.tag.outputs.value }}" .

  kind-deploy:
    name: Load image into kind and deploy
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local kind cluster
        uses: helm/kind-action@v1.12.0

      - name: Compute unique tag and load it into kind
        run: |
          IMAGE_TAG="${GITHUB_RUN_NUMBER:-0}-${GITHUB_SHA:-$(git rev-parse --short HEAD)}"
          kind load docker-image "agent-relay:${IMAGE_TAG}" --name kind
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Update the existing deployment manifest to the new image
        run: |
          cp k8s/agent-relay-deployment.yaml /tmp/agent-relay-deployment.yaml
          sed -i "s|image: agent-relay:local|image: agent-relay:${IMAGE_TAG}|g" /tmp/agent-relay-deployment.yaml

      - name: Deploy the new version with the existing k8s manifests
        run: |
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/postgres-service.yaml
          kubectl apply -f /tmp/agent-relay-deployment.yaml
          kubectl apply -f k8s/agent-relay-service.yaml

      - name: Wait for Kubernetes rollout completion
        run: |
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl rollout status deployment/agent-relay --timeout=180s
